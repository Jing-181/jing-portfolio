name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
      artifact_name: ${{ steps.name.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Name the Pages artifact
        id: name
        run: |
          # A full rerun uploads a new artifact; keep its name distinct.
          echo "artifact_name=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        id: upload
        with:
          name: ${{ steps.name.outputs.artifact_name }}
          path: .

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Wait for the Pages artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.package.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.package.outputs.artifact_name }}
        run: |
          # Upload can finish before GitHub lists the artifact for deployment.
          for delay in 1 2 4 8 16 0; do
            if gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f name="$ARTIFACT_NAME" \
              | jq -e --arg id "$ARTIFACT_ID" 'any(.artifacts[]; (.id | tostring) == $id and (.expired | not))' >/dev/null; then
              exit 0
            fi
            if [[ $delay -gt 0 ]]; then sleep "$delay"; fi
          done
          echo "::error::Pages artifact $ARTIFACT_NAME ($ARTIFACT_ID) was not listed after upload."
          exit 1
      - uses: actions/deploy-pages@v5
        id: deploy
        with:
          artifact_name: ${{ needs.package.outputs.artifact_name }}
