<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>经历线 — 潘静 · 个人志</title>
<meta name="description" content="潘静的经历线：从江西的小县城，到景德镇、佛山、深圳、广州，以及一路走过的那些地方。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%232A5C82'/%3E%3Ctext x='16' y='21' font-size='12.5' text-anchor='middle' fill='%23FCFAF6' font-family='serif'%3EJing%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/site.css">
<link rel="stylesheet" href="../assets/css/volumes.css">
<style>
  /* 第三卷主题色：黛蓝（远山含黛，秋水凝蓝） */
  :root { --accent: #2A5C82; --accent-deep: #1E4462; --accent-soft: #E3EAF2; --accent-tint: #2A5C82; }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="nav-logo" href="../index.html"><span class="seal-mini" style="background:#2A5C82">Jing</span><span class="brand">潘静</span></a>
    <div class="nav-links">
      <a href="../index.html">首页</a>
      <a href="resume.html">履历</a>
      <a href="tastes.html">喜好志</a>
      <a href="timeline.html" style="color:var(--accent)">经历线</a>
      <a href="training.html">训练档案</a>
    </div>
  </div>
</nav>

<header class="vol-hero">
  <div class="wrap">
    <div class="vol-kicker">第三卷 · TIMELINE</div>
    <div class="vol-state" id="vol-state" hidden></div>
    <h1>经历线</h1>
    <p class="vol-lede">
      从江西的小县城出发，读书在景德镇，工作在佛山、深圳，落脚在广州。
      把记得住的那些节点按时间铺开，<b>学业、工作、迁徙、旅行、生活</b>各归一类。
      数据源写在
      <code style="font-family:var(--mono);font-size:13px;color:var(--muted)">data/timeline.md</code>，
      页面读的是它生成的 <code style="font-family:var(--mono);font-size:13px;color:var(--muted)">data/timeline.json</code>。
    </p>
    <div class="vol-stat" id="tl-stat"></div>
  </div>
</header>

<main class="wrap" style="padding-bottom:96px;">
  <div class="filter-bar" id="filter-bar">
    <span class="fb-label">分类</span>
    <!-- 由数据渲染 -->
  </div>
  <div class="tl" id="tl">
    <div class="vol-empty">正在读取经历数据…</div>
  </div>

  <a class="vol-back" href="../index.html">← 回到个人志首页</a>
</main>

<footer>
  <div class="foot-inner">
    <span>© 2026 潘静 · 第三卷 · 经历线</span>
    <span id="t-updated"></span>
  </div>
</footer>

<script src="../assets/js/site.js"></script>
<script>
(function () {
  var listEl = document.getElementById('tl');
  var bar = document.getElementById('filter-bar');
  var statEl = document.getElementById('tl-stat');
  var state = { kind: '全部' };
  var ALL = [];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function dateParts(d) {
    var parts = String(d || '').split('-');
    return { y: parts[0] || '', m: parts[1] ? parts[1] + '月' : '' };
  }
  function item(it) {
    var dp = dateParts(it.date);
    var tags = (it.tags || []).map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('');
    return '<div class="tl-item reveal' + (it.private ? ' is-private' : '') + '">' +
      '<div class="tl-date"><b>' + esc(dp.y) + '</b>' + (dp.m ? '<small>' + esc(dp.m) + '</small>' : '') +
        (it.est ? '<span class="tl-est">推算</span>' : '') + '</div>' +
      '<div class="tl-axis"><i></i></div>' +
      '<div class="tl-body">' +
        '<div class="tl-head"><span class="tl-kind">' + esc(it.kind) + '</span>' +
          '<h3 class="tl-title">' + esc(it.title) +
          (it.private ? ' <span class="t-priv">仅本地</span>' : '') + '</h3></div>' +
        (it.place ? '<div class="tl-place">' + esc(it.place) + '</div>' : '') +
        (it.note ? '<p class="tl-note">' + esc(it.note) + '</p>' : '') +
        (tags ? '<div class="tl-tags">' + tags + '</div>' : '') +
      '</div></div>';
  }

  function kinds() {
    var seen = [], declared = ALL.__declared || [];
    ALL.forEach(function (it) { if (it.kind && seen.indexOf(it.kind) < 0) seen.push(it.kind); });
    var ordered = declared.filter(function (k) { return seen.indexOf(k) >= 0; });
    seen.forEach(function (k) { if (ordered.indexOf(k) < 0) ordered.push(k); });
    return ['全部'].concat(ordered);
  }

  function render() {
    bar.innerHTML = '<span class="fb-label">分类</span>' + kinds().map(function (k) {
      var n = k === '全部' ? ALL.length : ALL.filter(function (i) { return i.kind === k; }).length;
      return '<button class="chip' + (k === state.kind ? ' on' : '') + '" data-kind="' + esc(k) + '">' +
        esc(k) + '<i class="chip-n">' + n + '</i></button>';
    }).join('');

    var list = state.kind === '全部' ? ALL : ALL.filter(function (i) { return i.kind === state.kind; });
    listEl.innerHTML = list.length ? list.map(item).join('')
      : '<div class="vol-empty">这一类下<b>还没有节点</b>。<br>往 data/timeline.md 里加就行。</div>';
    if (window.__revealBind) window.__revealBind();
  }

  bar.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || !b.dataset.kind) return;
    state.kind = b.dataset.kind;
    render();
  });

  fetch('../data/timeline.json')
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      ALL = (data.items || []).slice();
      ALL.__declared = data.kinds || [];
      if (data.updated) document.getElementById('t-updated').textContent = '更新于 ' + data.updated;
      var years = ALL.map(function (i) { return parseInt(String(i.date || '').slice(0, 4), 10); }).filter(Boolean);
      if (years.length) {
        var a = Math.min.apply(null, years), b = Math.max.apply(null, years);
        var est = ALL.filter(function (i) { return i.est; }).length;
        statEl.innerHTML = '<span>' + a + ' — ' + b + '</span><span>' + ALL.length + ' 个节点</span>' +
          (est ? '<span>' + est + ' 个年份为推算</span>' : '');
      }
      render();
    })
    .catch(function () {
      listEl.innerHTML = '<div class="vol-empty">经历数据没能读出来。<br>' +
        '本地预览请用 <b>python3 -m http.server</b> 起个服务再打开。</div>';
    });
})();
window.__volState('timeline');
</script>
</body>
</html>
