<script>/* 已解锁的会话：首帧就把门藏掉，连闪都不会有 */try{if(sessionStorage.getItem('jing-unlock')==='1')document.documentElement.classList.add('pass')}catch(e){}</script>
<style>
  /* 第四卷主题色：檀色（老檀木静卧幽室，温厚沉敛） */
  :root { --accent: #8C6A4F; --accent-deep: #6B4F3A; --accent-soft: #F2EBE3; --accent-tint: #8C6A4F; }

<body>

<div class="lock-gate" id="lock-gate" role="dialog" aria-modal="true" aria-label="口令">
  <div class="lock-card">
    <div class="lock-seal">Jing</div>
    <h2 class="lock-title">这一卷，只给自己看</h2>
    <div class="lock-row">
      <input class="lock-input" type="password" autocomplete="off" spellcheck="false" aria-label="口令">
      <button class="lock-btn" type="button">进</button>
    </div>
    <p class="lock-hint">输入口令</p>
  </div>
</div>

<nav>
  <div class="nav-inner">
    <a class="nav-logo" href="../index.html"><span class="seal-mini" style="background:#8C6A4F">Jing</span><span class="brand">潘静</span></a>
    <div class="nav-links">
      <a href="../index.html">首页</a>
      <a href="resume.html">履历志</a>
      <a href="tastes.html">喜好志</a>

      <a href="training.html" style="color:var(--accent)">训练志</a>
    </div>
  </div>
</nav>

<header class="vol-hero">
  <div class="wrap">
    <div class="vol-kicker">第四卷 · TRAINING</div>
    <div class="vol-state" id="vol-state" hidden></div>
    <h1>训练志</h1>
    <p class="vol-lede" id="vol-lede"></p>
    <div class="figures" id="vol-figures"></div>
  </div>
</header>

<main class="wrap" style="padding-bottom:96px;">

  <section class="tblock" id="how-block" hidden>
    <div class="tblock-head">
      <h2 class="tblock-h">怎么练</h2>
      <span class="tblock-sub">没有固定课表</span>
    </div>
    <div class="how-body">
      <div class="how-tags" id="how-tags"></div>
      <p class="how-lede" id="how-lede"></p>
    </div>
  </section>

  <section class="tblock" id="mv-block" hidden>
    <div class="tblock-head">
      <h2 class="tblock-h">常用动作</h2>
      <span class="tblock-sub">重量是练到过的大数</span>
    </div>
    <div class="mv-grid" id="mv-grid"></div>
  </section>

  <section class="tblock" id="day-block" hidden>
    <div class="tblock-head">
      <h2 class="tblock-h">样例训练日</h2>
      <span class="tblock-sub">一天长什么样</span>
    </div>
    <div class="day-grid" id="day-grid"></div>
  </section>

  <section class="tblock" id="pr-block" hidden>
    <div class="tblock-head">
      <h2 class="tblock-h">力量突破</h2>
      <span class="tblock-sub">练到头的那几个数</span>
    </div>
    <div class="mv-grid" id="pr-grid"></div>
  </section>

  <section class="tblock" id="arc-block" hidden>
    <div class="tblock-head">
      <h2 class="tblock-h">档案</h2>
      <span class="tblock-sub">四年总账</span>
    </div>
    <div class="filter-bar" id="filter-bar">
      <span class="fb-label">分类</span>
      <!-- 由数据渲染 -->
    </div>
    <div class="tr-list" id="tr-list">
      <div class="vol-empty">正在读取训练数据…</div>
    </div>
    <div class="vol-empty" id="tr-hint" style="display:none;text-align:left;margin-top:22px;">
      按天记下的训练，之后再补进来。
    </div>
  </section>

  <a class="vol-back" href="../index.html">← 回到卷首</a>
</main>

<footer>
  <div class="foot-inner">
    <span>© 2026 潘静 · 第四卷 · 训练志</span>
    <span id="t-updated"></span>
  </div>
</footer>

<script src="../assets/js/lock.js"></script>
<script src="../assets/js/site.js"></script>
<script>
(function () {
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function bySection(name) {
    return ALL.filter(function (i) { return i.section === name; })
      .sort(function (a, b) { return (a.seq || 0) - (b.seq || 0); });
  }
  function splitLoad(s) {
    var m = String(s || '').match(/^(.*?)\s*([^\d\s]+)$/);
    if (m && m[1]) return '<b>' + esc(m[1]) + '</b><span>' + esc(m[2]) + '</span>';
    return s ? '<b>' + esc(s) + '</b>' : '';
  }
  function chips(list) {
    return (list || []).map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('');
  }
  function partTag(p) {
    return p ? '<span class="mv-part">' + esc(p) + '</span>' : '<span></span>';
  }

  /* ---- 页首大数字 ---- */
  function renderStats() {
    var el = document.getElementById('vol-figures');
    if (!STATS.length) return;
    el.innerHTML = STATS.map(function (s) {
      return '<div class="figure reveal">' +
        '<span class="fg-label">' + esc(s.label) + '</span>' +
        '<b class="fg-value">' + esc(s.value) + '</b>' +
        (s.sub ? '<span class="fg-sub">' + esc(s.sub) + '</span>' : '') +
      '</div>';
    }).join('');
  }

  /* ---- 怎么练 ---- */
  function renderHow() {
    var it = bySection('怎么练')[0];
    if (!it) return;
    document.getElementById('how-tags').innerHTML = chips(it.tags);
    document.getElementById('how-lede').textContent = it.note || '';
    document.getElementById('how-block').hidden = false;
  }

  /* ---- 常用动作 ---- */
  function movement(m) {
    return '<div class="mv reveal">' +
      '<div class="mv-top">' + partTag(m.part) + '</div>' +
      '<h3 class="mv-name">' + esc(m.name) + '</h3>' +
      (m.load ? '<div class="mv-load">' + splitLoad(m.load) + '</div>' : '') +
      (m.meta ? '<div class="mv-meta">' + esc(m.meta) + '</div>' : '') +
      (m.note ? '<p class="mv-note">' + esc(m.note) + '</p>' : '') +
      (m.tags && m.tags.length ? '<div class="tr-tags">' + chips(m.tags) + '</div>' : '') +
    '</div>';
  }
  function renderMovements() {
    if (!MOVE.length) return;
    document.getElementById('mv-grid').innerHTML = MOVE.map(movement).join('');
    document.getElementById('mv-block').hidden = false;
  }

  /* ---- 样例训练日 ---- */
  function dayCard(it) {
    return '<div class="day-card reveal">' +
      '<div class="day-top">' + partTag(it.part) +
        '<span class="day-date">' + esc(it.date) + '</span></div>' +
      '<h3 class="day-name">' + esc(it.title) + '</h3>' +
      (it.metric ? '<div class="day-meta">' + esc(it.metric) + '</div>' : '') +
      (it.note ? '<div class="day-list">' + esc(it.note) + '</div>' : '') +
      (it.tags && it.tags.length ? '<div class="tr-tags">' + chips(it.tags) + '</div>' : '') +
    '</div>';
  }
  function renderDays() {
    var list = bySection('样例训练日');
    if (!list.length) return;
    document.getElementById('day-grid').innerHTML = list.map(dayCard).join('');
    document.getElementById('day-block').hidden = false;
  }

  /* ---- 力量突破 ---- */
  function renderPRs() {
    var list = bySection('力量突破');
    if (!list.length) return;
    document.getElementById('pr-grid').innerHTML = list.map(function (it) {
      return '<div class="mv reveal">' +
        '<div class="mv-top">' + partTag(it.part) + '</div>' +
        '<h3 class="mv-name">' + esc(it.title) + '</h3>' +
        (it.metric ? '<div class="mv-load">' + splitLoad(it.metric) + '</div>' : '') +
        (it.note ? '<p class="mv-note">' + esc(it.note) + '</p>' : '') +
      '</div>';
    }).join('');
    document.getElementById('pr-block').hidden = false;
  }

  /* ---- 档案（可筛选总账） ---- */
  var SPECIAL = { '概览': 1, '怎么练': 1, '常用动作': 1, '样例训练日': 1, '力量突破': 1 };
  function archive() {
    return ALL.filter(function (i) { return !SPECIAL[i.section]; });
  }
  function weekday(d) {
    var p = String(d || '').split('-');
    if (p.length < 3) return '';
    var dt = new Date(+p[0], +p[1] - 1, +p[2]);
    if (isNaN(dt.getTime())) return '';
    return '周' + '日一二三四五六'[dt.getDay()];
  }
  function archiveItem(it) {
    return '<div class="tr-item reveal' + (it.private ? ' is-private' : '') + '">' +
      '<div class="tr-date">' + esc(it.date) +
        (weekday(it.date) ? '<small>' + weekday(it.date) + '</small>' : '') + '</div>' +
      '<div class="tr-main">' +
        '<div class="tr-head"><span class="tr-kind">' + esc(it.kind) + '</span>' +
          '<h3 class="tr-title">' + esc(it.title) + '</h3></div>' +
        (it.metric ? '<div class="tr-metric">' + esc(it.metric) + '</div>' : '') +
        (it.note ? '<p class="tr-note">' + esc(it.note) + '</p>' : '') +
        (it.tags && it.tags.length ? '<div class="tr-tags">' + chips(it.tags) + '</div>' : '') +
      '</div></div>';
  }
  function kinds() {
    var items = archive();
    var seen = [], declared = ALL.__declared || [];
    items.forEach(function (it) { if (it.kind && seen.indexOf(it.kind) < 0) seen.push(it.kind); });
    var ordered = declared.filter(function (k) { return seen.indexOf(k) >= 0; });
    seen.forEach(function (k) { if (ordered.indexOf(k) < 0) ordered.push(k); });
    return ['全部'].concat(ordered);
  }
  function renderArchive() {
    var items = archive();
    var bar = document.getElementById('filter-bar');
    var listEl = document.getElementById('tr-list');
    var hint = document.getElementById('tr-hint');
    document.getElementById('arc-block').hidden = ALL.length ? false : true;

    var ks = kinds();
    bar.style.display = items.length ? '' : 'none';
    bar.innerHTML = '<span class="fb-label">分类</span>' + ks.map(function (k) {
      var n = k === '全部' ? items.length : items.filter(function (i) { return i.kind === k; }).length;
      return '<button class="chip' + (k === state.kind ? ' on' : '') + '" data-kind="' + esc(k) + '">' +
        esc(k) + '<i class="chip-n">' + n + '</i></button>';
    }).join('');

    var list = state.kind === '全部' ? items : items.filter(function (i) { return i.kind === state.kind; });
    listEl.style.display = list.length ? '' : 'none';
    hint.style.display = items.length ? 'none' : '';
    if (list.length) listEl.innerHTML = list.map(archiveItem).join('');
  }

  var ALL = [], MOVE = [], STATS = [];
  var state = { kind: '全部' };

  document.getElementById('filter-bar').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || !b.dataset.kind) return;
    state.kind = b.dataset.kind;
    renderArchive();
    if (window.__revealBind) window.__revealBind();
  });

  fetch('../data/training.json')
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      ALL = (data.items || []).slice();
      MOVE = (data.movements || []).slice();
      STATS = (data.stats || []).slice();
      ALL.__declared = data.kinds || [];
      if (data.updated) document.getElementById('t-updated').textContent = '更新于 ' + data.updated;
      // 卷首语只在 data/training.md 里写一份，页面从 json 读
      var lede = document.getElementById('vol-lede');
      if (lede && data.lede) lede.innerHTML = data.lede;

      renderStats();
      renderHow();
      renderMovements();
      renderDays();
      renderPRs();
      renderArchive();
      if (window.__revealBind) window.__revealBind();
    })
    .catch(function () {
      document.getElementById('tr-hint').style.display = 'none';
      document.getElementById('tr-list').innerHTML = '<div class="vol-empty">训练数据没能读出来，刷新一下再看看。</div>';
      document.getElementById('arc-block').hidden = false;
    });
})();
window.__volState('training');
</script>
</body>
</html>
